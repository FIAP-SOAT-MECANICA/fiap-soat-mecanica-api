apiVersion: apps/v1
kind: Deployment
metadata:
  name: mecanica-db
  namespace: ${namespace}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mecanica-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mecanica-db
    spec:
      volumes:
        - name: mecanica-db
          persistentVolumeClaim:
            claimName: mecanica-db-pvc
      containers:
        - name: mecanica-db
          image: postgres:17
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: mecanica-db-secret
          volumeMounts:
            - name: mecanica-db
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 6
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
