apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-daemonset
  namespace: ${namespace}
spec:
  mode: daemonset # Garante uma réplica por nó da infraestrutura
  image: otel/opentelemetry-collector-contrib:0.152.0
  serviceAccount: otel-collector
    
  # ADICIONADO: Monta o sistema de arquivos do host para o hostmetrics
  volumes:
    - name: hostfs
      hostPath:
        path: /
  volumeMounts:
    - name: hostfs
      mountPath: /hostfs
      readOnly: true
      mountPropagation: HostToContainer

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Adiciona os privilégios necessários para ler o sistema de arquivos do Host
  securityContext:
    runAsUser: 0 # Executa como root para conseguir coletar as métricas de infraestrutura
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
      
  env:
    - name: DD_API_KEY
      valueFrom:
        secretKeyRef:
          name: otel-datadog-secret
          key: DD_API_KEY
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  config:
    connectors:
      datadog/connector: {}

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # ATIVAÇÃO: Coleta métricas de CPU e Memória do nó hospedeiro
      hostmetrics:
        root_path: /hostfs
        collection_interval: 10s
        scrapers:
          paging:
            metrics:
              system.paging.utilization:
                enabled: true
          cpu:
            metrics:
              system.cpu.utilization:
                enabled: true
          disk: {}
          filesystem:
            metrics:
              system.filesystem.utilization:
                enabled: true
          load: {}
          memory: {}
          network: {}
          processes: {}

      # Coleta consumo de CPU e memoria dos nos, pods e containers pelo kubelet.
      kubelet_stats:
        collection_interval: 10s
        auth_type: serviceAccount
        endpoint: https://$${env:K8S_NODE_NAME}:10250
        node: $${env:K8S_NODE_NAME}
        insecure_skip_verify: true # Necessario para o certificado do kubelet no Kind local.
        metric_groups: [node, pod, container]
        extra_metadata_labels:
          - container.id
        metrics:
          k8s.container.cpu_request_utilization:
            enabled: true
          k8s.container.cpu_limit_utilization:
            enabled: true
          k8s.container.memory_request_utilization:
            enabled: true
          k8s.container.memory_limit_utilization:
            enabled: true
          k8s.pod.cpu_request_utilization:
            enabled: true
          k8s.pod.cpu_limit_utilization:
            enabled: true
          k8s.pod.memory_request_utilization:
            enabled: true
          k8s.pod.memory_limit_utilization:
            enabled: true

    processors:
      resource:
        attributes:
          - key: deployment.environment
            value: "prd" # Coloque o mesmo ambiente da sua API
            action: insert
          - key: k8s.cluster.name
            value: "${cluster_name}"
            action: insert
          - key: host.name
            value: $${env:K8S_NODE_NAME}
            action: upsert
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch:
        send_batch_max_size: 100
        send_batch_size: 10
        timeout: 10s
        
      # Vincula as métricas do nó e da app de forma unificada no Datadog
      k8sattributes:
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
          labels:
            - tag_name: deployment.environment
              key: tags.datadoghq.com/env
              from: pod
            - tag_name: service.name
              key: tags.datadoghq.com/service
              from: pod
            - tag_name: service.version
              key: tags.datadoghq.com/version
              from: pod
        passthrough: false

      # Adiciona metadados do host para correlacionar APM e Infraestrutura no Datadog
      resourcedetection:
        detectors: [system]
        system:
          hostname_sources: ["os"]

    exporters:
      datadog/exporter:
        api:
          key: $${env:DD_API_KEY}
          site: datadoghq.com

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [datadog/connector, datadog/exporter]
        metrics:
          # ADICIONADO: O pipeline de métricas agora recebe tanto os dados do Java (otlp) quanto os do Host (hostmetrics)
          receivers: [datadog/connector, otlp, hostmetrics, kubelet_stats]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource, batch]
          exporters: [datadog/exporter]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [datadog/exporter]
