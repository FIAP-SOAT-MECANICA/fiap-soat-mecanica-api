apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-daemonset
  namespace: ${namespace}
spec:
  mode: daemonset # Garante uma réplica por nó da infraestrutura
  image: otel/opentelemetry-collector-contrib:0.152.0
  serviceAccount: otel-collector
    
  # ADICIONADO: Monta o sistema de arquivos do host para o hostmetrics
  volumes:
    - name: hostfs
      hostPath:
        path: /
  volumeMounts:
    - name: hostfs
      mountPath: /hostfs
      readOnly: true
      mountPropagation: HostToContainer

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Adiciona os privilégios necessários para ler o sistema de arquivos do Host
  securityContext:
    runAsUser: 0 # Executa como root para conseguir coletar as métricas de infraestrutura
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
      
  env:
    - name: DD_API_KEY
      valueFrom:
        secretKeyRef:
          name: otel-datadog-secret
          key: DD_API_KEY

  config:
    connectors:
      datadog/connector: {}

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # ATIVAÇÃO: Coleta métricas de CPU e Memória do nó hospedeiro
      hostmetrics:
        root_path: /hostfs
        collection_interval: 10s
        scrapers:
          paging:
            metrics:
              system.paging.utilization:
                enabled: true
          cpu:
            metrics:
              system.cpu.utilization:
                enabled: true
          disk: {}
          filesystem:
            metrics:
              system.filesystem.utilization:
                enabled: true
          load: {}
          memory: {}
          network: {}
          processes: {}

    processors:
      resource:
        attributes:
          - key: deployment.environment
            value: "prd" # Coloque o mesmo ambiente da sua API
            action: insert
          - key: k8s.cluster.name
            value: "oficina-cluster" # Nome do seu cluster Kubernetes
            action: insert
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch:
        send_batch_max_size: 100
        send_batch_size: 10
        timeout: 10s
        
      # Vincula as métricas do nó e da app de forma unificada no Datadog
      k8sattributes:
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
        passthrough: false

      # Adiciona metadados do host para correlacionar APM e Infraestrutura no Datadog
      resourcedetection:
        detectors: [system]
        system:
          hostname_sources: ["os"]

    exporters:
      datadog/exporter:
        api:
          key: $${env:DD_API_KEY}
          site: datadoghq.com

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [datadog/connector, datadog/exporter]
        metrics:
          # ADICIONADO: O pipeline de métricas agora recebe tanto os dados do Java (otlp) quanto os do Host (hostmetrics)
          receivers: [datadog/connector, otlp, hostmetrics]
          processors: [memory_limiter, resourcedetection, resource, k8sattributes, batch]
          exporters: [datadog/exporter]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [datadog/exporter]
