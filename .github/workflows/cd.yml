name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-kind-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  image:
    name: Resolve immutable image tag
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/${{ steps.repo.outputs.image_repo }}:${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Lowercase repository name for the GHCR tag
        id: repo
        run: echo "image_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  docker:
    name: Build and publish immutable image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image tagged with the tested SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ needs.image.outputs.image }}

  deploy:
    name: Provision, validate and destroy Kind
    needs: [image, docker]
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_cluster_name: oficina-cluster
      TF_VAR_namespace: mecanica
      TF_VAR_api_image: ${{ needs.image.outputs.image }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
      KUBECONFIG: ${{ github.workspace }}/infra/kubeconfig

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$TF_VAR_db_password" || { echo "Missing GitHub secret DB_PASSWORD"; exit 1; }
          test -n "$TF_VAR_jwt_secret" || { echo "Missing GitHub secret JWT_SECRET"; exit 1; }
          test -n "$TF_VAR_datadog_api_key" || { echo "Missing GitHub secret DATADOG_API_KEY"; exit 1; }

      - name: Verify that the GHCR image is public
        shell: bash
        run: |
          docker logout ghcr.io || true
          docker pull "$TF_VAR_api_image"

      - name: Terraform format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        id: terraform-init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -out=deploy.tfplan

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve deploy.tfplan

      - name: Validate cluster and workloads
        shell: bash
        run: |
          kubectl cluster-info
          kubectl wait --namespace "$TF_VAR_namespace" --for=condition=Ready pod --selector=app=mecanica-db --timeout=180s
          kubectl rollout status deployment/mecanica-db --namespace "$TF_VAR_namespace" --timeout=180s
          kubectl wait --namespace "$TF_VAR_namespace" --for=condition=Ready pod --selector=app=mecanica-api --timeout=240s
          kubectl rollout status deployment/mecanica-api --namespace "$TF_VAR_namespace" --timeout=240s
          kubectl wait --for=condition=Available apiservice/v1beta1.metrics.k8s.io --timeout=180s

          for attempt in {1..18}; do
            if kubectl top pods --namespace "$TF_VAR_namespace"; then
              break
            fi
            if [[ "$attempt" == "18" ]]; then
              kubectl describe deployment/metrics-server --namespace kube-system
              exit 1
            fi
            sleep 10
          done

          for attempt in {1..18}; do
            current_metrics="$(kubectl get hpa/mecanica-api-hpa --namespace "$TF_VAR_namespace" --output=jsonpath='{range .status.currentMetrics[*]}{.resource.current.averageUtilization}{" "}{end}')"
            if [[ "$(wc -w <<< "$current_metrics")" -eq 2 ]]; then
              break
            fi
            if [[ "$attempt" == "18" ]]; then
              kubectl describe hpa/mecanica-api-hpa --namespace "$TF_VAR_namespace"
              exit 1
            fi
            sleep 10
          done

          kubectl get pods,services,deployments,hpa --namespace "$TF_VAR_namespace" --output=wide
          kubectl describe hpa/mecanica-api-hpa --namespace "$TF_VAR_namespace"

          actual_image="$(kubectl get deployment/mecanica-api --namespace "$TF_VAR_namespace" --output=jsonpath='{.spec.template.spec.containers[0].image}')"
          test "$actual_image" = "$TF_VAR_api_image"

          pull_errors="$(kubectl get pods --namespace "$TF_VAR_namespace" --output=jsonpath='{range .items[*].status.containerStatuses[*]}{.state.waiting.reason}{"\n"}{end}')"
          if grep -Eq "ImagePullBackOff|ErrImagePull" <<< "$pull_errors"; then
            echo "A workload has an image pull error"
            exit 1
          fi

          kubectl wait --namespace opentelemetry-system --for=condition=Available deployment --selector=app.kubernetes.io/name=opentelemetry-operator --timeout=180s
          kubectl wait --for=condition=Established crd/opentelemetrycollectors.opentelemetry.io --timeout=60s
          kubectl wait --for=condition=Established crd/instrumentations.opentelemetry.io --timeout=60s
          kubectl rollout status daemonset/otel-daemonset-collector --namespace "$TF_VAR_namespace" --timeout=180s
          injected_agent="$(
            kubectl get pods --namespace "$TF_VAR_namespace" --selector app=mecanica-api --output jsonpath='{.items[0].spec.initContainers[*].name}'
          )"
          grep -q "opentelemetry-auto-instrumentation-java" <<< "$injected_agent"
          kubectl get instrumentation,opentelemetrycollector --namespace "$TF_VAR_namespace"
          kubectl logs daemonset/otel-daemonset-collector --namespace "$TF_VAR_namespace" --tail=200

      - name: Validate Flyway migrations and secret-safe logs
        shell: bash
        run: |
          api_logs="$(kubectl logs deployment/mecanica-api --namespace "$TF_VAR_namespace" --all-pods=true --tail=1000)"
          db_logs="$(kubectl logs deployment/mecanica-db --namespace "$TF_VAR_namespace" --tail=500)"

          if [[ "$api_logs$db_logs" == *"$TF_VAR_db_password"* || "$api_logs$db_logs" == *"$TF_VAR_jwt_secret"* ]]; then
            echo "A secret value was detected in workload logs"
            exit 1
          fi

          grep -E "Flyway|Migrat|schema" <<< "$api_logs" || true
          grep -Eq "Successfully (applied|validated) 9 migrations" <<< "$api_logs"
          grep -Eiq 'version[^0-9]*(v)?9' <<< "$api_logs"

      - name: Run API health check and smoke test
        env:
          API_BASE_URL: http://127.0.0.1:8080
        shell: bash
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors \
            "$API_BASE_URL/actuator/health/readiness"
          node tests/api-smoke/api-smoke.mjs

      - name: Terraform destroy
        if: ${{ always() && steps.terraform-init.outcome == 'success' }}
        working-directory: infra
        run: terraform destroy -input=false -auto-approve

      - name: Confirm that no Kind container remains
        if: ${{ always() }}
        shell: bash
        run: |
          leftovers="$(docker ps --all --filter "name=${TF_VAR_cluster_name}" --format '{{.Names}}')"
          if [[ -n "$leftovers" ]]; then
            echo "Kind containers still present:"
            echo "$leftovers"
            exit 1
          fi

  deploy-eks:
    name: Deploy to AWS EKS
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: [image, docker]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-eks
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || vars.TF_STATE_REGION || 'us-east-1' }}
      CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'mecanica' }}
      NAMESPACE: ${{ vars.NAMESPACE || 'mecanica' }}
      DB_SECRET_NAME: ${{ vars.DB_SECRET_NAME || 'mecanica-db-credentials' }}
      AUTH_JWT_SECRET_NAME: ${{ vars.AUTH_JWT_SECRET_NAME || 'fiap-soat-mecanica-auth-production-jwt' }}
      API_IMAGE: ${{ needs.image.outputs.image }}
      API_NODE_PORT: ${{ vars.API_NODE_PORT || '30080' }}
      TRAEFIK_NAMESPACE: ${{ vars.TRAEFIK_NAMESPACE || 'traefik' }}

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Check required secrets
        shell: bash
        run: |
          test -n "${{ secrets.JWT_SECRET }}" || { echo "Missing repository secret JWT_SECRET"; exit 1; }

      - name: Verify that the GHCR image is public
        shell: bash
        run: |
          docker logout ghcr.io || true
          docker pull "$API_IMAGE"

      - name: Point kubectl at the EKS cluster
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Ensure envsubst is available
        shell: bash
        run: |
          if ! command -v envsubst >/dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends gettext-base
          fi

      - name: Apply namespace
        run: namespace="$NAMESPACE" envsubst < k8s/namespace.yaml | kubectl apply -f -

      - name: Read RDS credentials from Secrets Manager
        id: db
        shell: bash
        run: |
          secret_json="$(aws secretsmanager get-secret-value --secret-id "$DB_SECRET_NAME" --query SecretString --output text)"
          db_host="$(jq -r .host <<< "$secret_json")"
          db_port="$(jq -r .port <<< "$secret_json")"
          db_name="$(jq -r .dbname <<< "$secret_json")"
          db_user="$(jq -r .username <<< "$secret_json")"
          db_pass="$(jq -r .password <<< "$secret_json")"
          echo "::add-mask::$db_user"
          echo "::add-mask::$db_pass"
          {
            echo "host=$db_host"
            echo "port=$db_port"
            echo "name=$db_name"
          } >> "$GITHUB_OUTPUT"
          {
            echo "user=$db_user"
            echo "pass=$db_pass"
          } >> "$GITHUB_OUTPUT"

      - name: Read Auth JWT secret from Secrets Manager (best-effort)
        id: auth
        shell: bash
        run: |
          secret_json="$(aws secretsmanager get-secret-value --secret-id "$AUTH_JWT_SECRET_NAME" --query SecretString --output text 2>/dev/null || true)"
          if [[ -z "$secret_json" ]]; then
            echo "Auth JWT secret '$AUTH_JWT_SECRET_NAME' not found yet - client tokens will be rejected until the -auth repo is deployed."
            echo "secret=" >> "$GITHUB_OUTPUT"
          else
            auth_secret="$(jq -r .secret <<< "$secret_json")"
            echo "::add-mask::$auth_secret"
            echo "secret=$auth_secret" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply API secret
        env:
          DB_USER: ${{ steps.db.outputs.user }}
          DB_PASS: ${{ steps.db.outputs.pass }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_JWT_SECRET: ${{ steps.auth.outputs.secret }}
        run: |
          kubectl create secret generic mecanica-api-secret \
            --namespace "$NAMESPACE" \
            --from-literal=SPRING_DATASOURCE_USERNAME="$DB_USER" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="$DB_PASS" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=AUTH_JWT_SECRET="$AUTH_JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply API configmap
        env:
          DB_HOST: ${{ steps.db.outputs.host }}
          DB_PORT: ${{ steps.db.outputs.port }}
          DB_NAME: ${{ steps.db.outputs.name }}
        run: |
          kubectl create configmap mecanica-api-config \
            --namespace "$NAMESPACE" \
            --from-literal=SPRING_DATASOURCE_URL="jdbc:postgresql://$DB_HOST:$DB_PORT/$DB_NAME" \
            --from-literal=EMAIL_NOTIFICATIONS_ENABLED=false \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply API service, deployment and HPA
        run: |
          namespace="$NAMESPACE" api_node_port="$API_NODE_PORT" envsubst < k8s/api-service.yaml | kubectl apply -f -
          namespace="$NAMESPACE" api_image="$API_IMAGE" envsubst < k8s/api-deployment.yaml | kubectl apply -f -
          namespace="$NAMESPACE" envsubst < k8s/api-hpa.yaml | kubectl apply -f -

      - name: Apply gateway Ingress
        run: namespace="$NAMESPACE" envsubst < k8s/gateway/ingress.yaml | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/mecanica-api --namespace "$NAMESPACE" --timeout=300s

      - name: Health check via port-forward
        shell: bash
        run: |
          kubectl port-forward svc/mecanica-api 18080:8080 --namespace "$NAMESPACE" &
          pf_pid=$!
          trap 'kill $pf_pid' EXIT
          sleep 5
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors \
            http://127.0.0.1:18080/actuator/health/readiness

      - name: Validate routing through the Traefik gateway
        shell: bash
        run: |
          kubectl port-forward svc/traefik 18090:80 --namespace "$TRAEFIK_NAMESPACE" &
          pf_pid=$!
          trap 'kill $pf_pid' EXIT
          sleep 5
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors \
            http://127.0.0.1:18090/actuator/health/readiness

      - name: Print access instructions
        run: |
          {
            echo "### API disponivel no EKS, atras do gateway Traefik"
            echo ""
            echo "Imagem: \`$API_IMAGE\`"
            echo ""
            echo "Para acessar durante a demo, rode localmente (com as credenciais do Learner Lab ativas):"
            echo ""
            echo '```bash'
            echo "aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_REGION"
            echo ""
            echo "# via o gateway (recomendado - e o que o enunciado pede pra demonstrar)"
            echo "kubectl port-forward svc/traefik 8080:80 --namespace $TRAEFIK_NAMESPACE"
            echo ""
            echo "# acesso direto ao service da API, sem passar pelo gateway"
            echo "kubectl port-forward svc/mecanica-api 8081:8080 --namespace $NAMESPACE"
            echo '```'
            echo ""
            echo "Pelo gateway: http://localhost:8080/swagger-ui.html"
            echo "Direto: http://localhost:8081/swagger-ui.html"
          } >> "$GITHUB_STEP_SUMMARY"
